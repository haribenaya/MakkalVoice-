      <text x="96" y="541" class="mono" font-size="12.5" fill="#E2E8F0">
        <tspan fill="#10B981">~/makkalvoice</tspan>
        <tspan fill="#64748B"> $ </tspan>
        <tspan fill="#F8FAFC">npm run dev</tspan>
      </text>
      <rect x="304" y="529" width="7" height="14" rx="1.5" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- RIGHT COLUMN: SYSTEM.INFO PANEL -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.2s" fill="freeze" />

      <rect x="476" y="80" width="668" height="494" rx="16" fill="#0F172A" fill-opacity="0.34" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
      <text x="500" y="106" class="mono label-sm" fill="#22D3EE">SYSTEM.INFO</text>
      <text x="1120" y="106" text-anchor="end" class="mono" font-size="11.5" fill="#64748B">
        hariharan@makkalvoice:~$ ./profile.sh
      </text>
      <line x1="500" y1="120" x2="1120" y2="120" stroke="#334155" stroke-opacity="0.55" stroke-width="1" />

      <!-- Primary Heading + Rotating Role -->
      <text x="500" y="160" class="sans" font-size="28" font-weight="800" fill="#F8FAFC" opacity="0">
        Hariharan M
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.35s" fill="freeze" />
      </text>

      <text x="500" y="190" class="mono" font-size="14" fill="#94A3B8">Role:</text>
      <!-- Rotating Roles via SMIL -->
      <text x="554" y="190" class="mono" font-size="14.5" font-weight="700" fill="#22D3EE" opacity="1">
        Software Builder
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.66;0.94;0.99;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="554" y="190" class="mono" font-size="14.5" font-weight="700" fill="#A78BFA" opacity="0">
        Full-Stack Developer
        <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.31;0.36;0.62;0.67;0.99;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="554" y="190" class="mono" font-size="14.5" font-weight="700" fill="#34D399" opacity="0">
        Voice-First AI Builder
        <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.64;0.66;0.70;0.93;0.98;1" dur="12s" repeatCount="indefinite" />
      </text>

      <!-- Structured Profile Rows (Right-Aligned Labels, Left-Aligned Values) -->
      <g class="mono" font-size="12.5" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.5s" fill="freeze" />

        <text x="604" y="232" text-anchor="end" fill="#64748B">&gt; TEAM</text>
        <text x="624" y="232" fill="#E2E8F0">Hariharan's Team · Build for Bharat</text>

        <text x="604" y="258" text-anchor="end" fill="#64748B">&gt; FOCUS</text>
        <text x="624" y="258" fill="#E2E8F0">Voice Interfaces · Civic Tech · Full-Stack Web</text>

        <text x="604" y="284" text-anchor="end" fill="#64748B">&gt; SCOPE</text>
        <text x="624" y="284" fill="#E2E8F0">13 Indian Languages · Hands-Free Real-Time Audio</text>

        <text x="604" y="310" text-anchor="end" fill="#64748B">&gt; PRIVACY</text>
        <text x="624" y="310" fill="#E2E8F0">On-Device Personal Details · Permissioned Dispatch</text>

        <text x="604" y="336" text-anchor="end" fill="#64748B">&gt; EMAIL</text>
        <text x="624" y="336" fill="#22D3EE">hariharan.m.s.287@gmail.com</text>
      </g>

      <!-- Tech Stack Section -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.65s" fill="freeze" />
        <text x="500" y="370" class="mono label-sm" fill="#94A3B8">CORE STACK</text>

        <!-- Row 1 Pills (500..1120) -->
        <g class="mono" font-size="12" font-weight="600" fill="#E2E8F0">
          <rect x="500" y="382" width="138" height="28" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
          <circle cx="516" cy="396" r="3" fill="#3B82F6" />
          <text x="528" y="400">TypeScript</text>

          <rect x="648" y="382" width="130" height="28" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
          <circle cx="664" cy="396" r="3" fill="#22D3EE" />
          <text x="676" y="400">React 19</text>

          <rect x="788" y="382" width="172" height="28" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
          <circle cx="804" cy="396" r="3" fill="#10B981" />
          <text x="816" y="400">Node.js + Express</text>

          <rect x="970" y="382" width="150" height="28" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
          <circle cx="986" cy="396" r="3" fill="#A78BFA" />
          <text x="998" y="400">WebSockets</text>
        </g>

        <!-- Row 2 Pills (500..1030) -->
        <g class="mono" font-size="12" font-weight="600" fill="#E2E8F0">
          <rect x="500" y="418" width="138" height="28" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
          <circle cx="516" cy="432" r="3" fill="#22D3EE" />
          <text x="528" y="436">Gemini AI</text>

          <rect x="648" y="418" width="146" height="28" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
          <circle cx="664" cy="432" r="3" fill="#38BDF8" />
          <text x="676" y="436">Tailwind CSS</text>

          <rect x="804" y="418" width="104" height="28" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
          <circle cx="820" cy="432" r="3" fill="#F59E0B" />
          <text x="832" y="436">Vite</text>

          <rect x="918" y="418" width="112" height="28" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
          <circle cx="934" cy="432" r="3" fill="#10B981" />
          <text x="946" y="436">jsPDF</text>
        </g>
      </g>

      <!-- Featured Project Card -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.8s" fill="freeze" />
        <rect x="500" y="464" width="620" height="92" rx="12" fill="#020617" fill-opacity="0.6" stroke="url(#accentGradDark)" stroke-opacity="0.55" stroke-width="1" />
        <text x="518" y="486" class="mono label-sm" fill="#22D3EE">FEATURED BUILD</text>
        <text x="1102" y="486" text-anchor="end" class="mono" font-size="10.5" fill="#34D399">
          ZERO-SECRET LOCAL START READY
        </text>
        <text x="518" y="514" class="sans" font-size="16" font-weight="700" fill="#F8FAFC">
          MakkalVoice
        </text>
        <text x="518" y="538" class="sans" font-size="12.5" fill="#CBD5E1">
