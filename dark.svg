        <rect x="56" y="124" width="384" height="28" fill="url(#scanlineDark)">
          <animate attributeName="y" values="110;372;110" dur="7s" repeatCount="indefinite" />
        </rect>

        <!-- Symmetric Dot-Matrix Acoustic & Civic Crest -->
        <g text-anchor="middle" fill="url(#asciiGradDark)" class="ascii">
          <text x="248" y="150" opacity="0">· : + * # @ @ # * + : ·<animate attributeName="opacity" from="0" to="0.88" dur="0.25s" begin="0.22s" fill="freeze" /></text>
          <text x="248" y="166" opacity="0">. · + * # % @ @ % # * + · .<animate attributeName="opacity" from="0" to="0.92" dur="0.25s" begin="0.27s" fill="freeze" /></text>
          <text x="248" y="182" opacity="0">: + # % @   ::   @ % # + :<animate attributeName="opacity" from="0" to="0.95" dur="0.25s" begin="0.32s" fill="freeze" /></text>
          <text x="248" y="198" opacity="0">+ * % @ :   +##+   : @ % * +<animate attributeName="opacity" from="0" to="0.95" dur="0.25s" begin="0.37s" fill="freeze" /></text>
          <text x="248" y="214" opacity="0"># % @ *   +#@@@@#+   * @ % #<animate attributeName="opacity" from="0" to="0.98" dur="0.25s" begin="0.42s" fill="freeze" /></text>
          <text x="248" y="230" opacity="0">@ @ +   +#@@ :: @@#+   + @ @<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.47s" fill="freeze" /></text>
          <text x="248" y="246" opacity="0">@ # :   #@@ ·**· @@#   : # @<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.52s" fill="freeze" /></text>
          <text x="248" y="262" opacity="0">@ @ +   +#@@ :: @@#+   + @ @<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.57s" fill="freeze" /></text>
          <text x="248" y="278" opacity="0"># % @ *   +#@@@@#+   * @ % #<animate attributeName="opacity" from="0" to="0.98" dur="0.25s" begin="0.62s" fill="freeze" /></text>
          <text x="248" y="294" opacity="0">+ * % @ :   +##+   : @ % * +<animate attributeName="opacity" from="0" to="0.95" dur="0.25s" begin="0.67s" fill="freeze" /></text>
          <text x="248" y="310" opacity="0">: + # % @   ::   @ % # + :<animate attributeName="opacity" from="0" to="0.92" dur="0.25s" begin="0.72s" fill="freeze" /></text>
          <text x="248" y="326" opacity="0">. · + * # % @ @ % # * + · .<animate attributeName="opacity" from="0" to="0.9" dur="0.25s" begin="0.77s" fill="freeze" /></text>
          <text x="248" y="342" opacity="0">· : + * # @ @ # * + : ·<animate attributeName="opacity" from="0" to="0.86" dur="0.25s" begin="0.82s" fill="freeze" /></text>
          <text x="248" y="358" opacity="0" fill="#94A3B8">::: ·· VOICE MATRIX ·· :::<animate attributeName="opacity" from="0" to="0.75" dur="0.25s" begin="0.88s" fill="freeze" /></text>
        </g>
      </g>

      <!-- Left Column Identity Summary -->
      <text x="248" y="406" text-anchor="middle" class="mono label-sm" fill="#A78BFA">
        [ VOICE-FIRST · CIVIC TECH ]
      </text>
      <text x="248" y="440" text-anchor="middle" class="sans" font-size="26" font-weight="800" fill="#F8FAFC">
        Hariharan M
      </text>
      <text x="248" y="468" text-anchor="middle" class="mono" font-size="14.5" font-weight="600" fill="#22D3EE">
        Building MakkalVoice
      </text>
      <text x="248" y="494" text-anchor="middle" class="sans" font-size="12.5" fill="#94A3B8">
