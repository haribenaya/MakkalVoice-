    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.1s" fill="freeze" />

      <rect x="36" y="80" width="424" height="494" rx="16" fill="#0F172A" fill-opacity="0.34" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
      <text x="56" y="106" class="mono label-sm" fill="#22D3EE">VISUAL.MAP</text>
      <text x="440" y="106" text-anchor="end" class="mono" font-size="10.5" fill="#64748B">13 LANGUAGES · VOICE</text>

