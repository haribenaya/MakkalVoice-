    <!-- Online Status Pill -->
    <rect x="1016" y="27" width="124" height="26" rx="13" fill="#0F172A" fill-opacity="0.75" stroke="#10B981" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="1034" cy="40" r="4" fill="#10B981" filter="url(#softGlowDark)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="1048" y="44" class="mono" font-size="11.5" font-weight="700" fill="#34D399" letter-spacing="1.2">
      ONLINE
    </text>

