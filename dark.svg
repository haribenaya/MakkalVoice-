<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Hariharan M — Software Builder &amp; Voice-First AI Developer Profile Banner (Dark Theme)">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .ascii { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; letter-spacing: 2px; }
      .label-sm { font-size: 11px; letter-spacing: 1.6px; font-weight: 700; }
    </style>

    <!-- Background & Ambient Gradients -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>

    <radialGradient id="glowViolet" cx="20%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="82%" cy="76%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="55%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="asciiGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="scanlineDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Technical Grid -->
    <pattern id="gridDark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>

    <!-- Outer Clip & Scanline Clip -->
    <clipPath id="frameClipDark">
      <rect x="16" y="16" width="1148" height="578" rx="22" />
    </clipPath>

    <clipPath id="asciiBoxClipDark">
      <rect x="56" y="124" width="384" height="248" rx="12" />
    </clipPath>

    <filter id="softGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <g clip-path="url(#frameClipDark)">
    <rect x="16" y="16" width="1148" height="578" rx="22" fill="url(#bgGradDark)" />
    <rect x="16" y="16" width="1148" height="578" rx="22" fill="url(#gridDark)" />
    <rect x="16" y="16" width="1148" height="578" rx="22" fill="url(#glowViolet)" />
    <rect x="16" y="16" width="1148" height="578" rx="22" fill="url(#glowCyan)" />
    <rect x="16" y="16" width="1148" height="578" rx="22" fill="url(#glowEmerald)" />

    <!-- Subtle Floating Ambient Particles -->
    <g fill="#22D3EE" opacity="0.35">
      <circle cx="130" cy="180" r="1.5">
        <animate attributeName="cy" values="180;155;180" dur="9s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2;0.55;0.2" dur="9s" repeatCount="indefinite" />
      </circle>
      <circle cx="430" cy="490" r="1.4">
        <animate attributeName="cy" values="490;465;490" dur="11s" repeatCount="indefinite" />
      </circle>
      <circle cx="720" cy="110" r="1.5">
        <animate attributeName="cy" values="110;132;110" dur="10s" repeatCount="indefinite" />
      </circle>
      <circle cx="1060" cy="390" r="1.6" fill="#A78BFA">
        <animate attributeName="cy" values="390;360;390" dur="12s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Terminal Top Bar -->
    <rect x="16" y="16" width="1148" height="48" fill="#0F172A" fill-opacity="0.6" />
    <line x1="16" y1="64" x2="1164" y2="64" stroke="#334155" stroke-opacity="0.55" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="44" cy="40" r="5.5" fill="#EF4444" />
    <circle cx="62" cy="40" r="5.5" fill="#F59E0B" />
    <circle cx="80" cy="40" r="5.5" fill="#10B981" />

    <text x="104" y="44" class="mono" font-size="13" fill="#CBD5E1" font-weight="600">
      hariharan@makkalvoice:~
    </text>

    <!-- Decorative Section Labels -->
    <g class="mono" font-size="12" fill="#94A3B8">
      <text x="770" y="44">System</text>
      <text x="845" y="44">Stack</text>
      <text x="920" y="44">Project</text>
