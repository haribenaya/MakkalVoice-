          <text x="248" y="166" opacity="0">. · + * # % @ @ % # * + · .<animate attributeName="opacity" from="0" to="0.95" dur="0.25s" begin="0.27s" fill="freeze" /></text>
          <text x="248" y="182" opacity="0">: + # % @   ::   @ % # + :<animate attributeName="opacity" from="0" to="0.98" dur="0.25s" begin="0.32s" fill="freeze" /></text>
          <text x="248" y="198" opacity="0">+ * % @ :   +##+   : @ % * +<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.37s" fill="freeze" /></text>
          <text x="248" y="214" opacity="0"># % @ *   +#@@@@#+   * @ % #<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.42s" fill="freeze" /></text>
          <text x="248" y="230" opacity="0">@ @ +   +#@@ :: @@#+   + @ @<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.47s" fill="freeze" /></text>
          <text x="248" y="246" opacity="0">@ # :   #@@ ·**· @@#   : # @<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.52s" fill="freeze" /></text>
          <text x="248" y="262" opacity="0">@ @ +   +#@@ :: @@#+   + @ @<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.57s" fill="freeze" /></text>
          <text x="248" y="278" opacity="0"># % @ *   +#@@@@#+   * @ % #<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.62s" fill="freeze" /></text>
          <text x="248" y="294" opacity="0">+ * % @ :   +##+   : @ % * +<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.67s" fill="freeze" /></text>
          <text x="248" y="310" opacity="0">: + # % @   ::   @ % # + :<animate attributeName="opacity" from="0" to="0.95" dur="0.25s" begin="0.72s" fill="freeze" /></text>
          <text x="248" y="326" opacity="0">. · + * # % @ @ % # * + · .<animate attributeName="opacity" from="0" to="0.92" dur="0.25s" begin="0.77s" fill="freeze" /></text>
          <text x="248" y="342" opacity="0">· : + * # @ @ # * + : ·<animate attributeName="opacity" from="0" to="0.9" dur="0.25s" begin="0.82s" fill="freeze" /></text>
          <text x="248" y="358" opacity="0" fill="#475569">::: ·· VOICE MATRIX ·· :::<animate attributeName="opacity" from="0" to="0.85" dur="0.25s" begin="0.88s" fill="freeze" /></text>
        </g>
