      </circle>
      <circle cx="430" cy="490" r="1.4" fill="#06B6D4">
        <animate attributeName="cy" values="490;465;490" dur="11s" repeatCount="indefinite" />
      </circle>
      <circle cx="720" cy="110" r="1.5">
