<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Hariharan M — Software Builder &amp; Voice-First AI Developer Profile Banner (Light Theme)">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .ascii { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; letter-spacing: 2px; }
      .label-sm { font-size: 11px; letter-spacing: 1.6px; font-weight: 700; }
    </style>

    <!-- Genuinely Designed Light Editorial Canvas -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF6FF" />
    </linearGradient>

    <radialGradient id="glowBlueLight" cx="18%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyanLight" cx="84%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmeraldLight" cx="55%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="asciiGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="scanlineLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <pattern id="gridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.15" />
    </pattern>

    <clipPath id="frameClipLight">
