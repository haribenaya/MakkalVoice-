    </clipPath>

    <clipPath id="asciiBoxClipLight">
      <rect x="56" y="124" width="384" height="248" rx="12" />
    </clipPath>

    <filter id="cardShadowLight" x="-5%" y="-5%" width="110%" height="112%">
